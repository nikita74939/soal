<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilih Paket Soal</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Times New Roman", Times, Georgia, serif;
    background: #d9d9d9;
    color: #000;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 620px;
    padding: 48px 46px 54px;
    box-shadow: 0 4px 18px rgba(0,0,0,.28);
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  .sub {
    font-style: italic;
    color: #444;
    margin: 0 0 8px;
    font-size: .95rem;
  }
  .rule {
    border: none;
    border-top: 3px double #000;
    margin: 0 0 30px;
  }
  .pilihan {
    display: flex;
    gap: 22px;
    justify-content: center;
    flex-wrap: wrap;
  }
  a.paket {
    display: block;
    flex: 1 1 220px;
    max-width: 250px;
    text-decoration: none;
    color: #000;
    border: 2px solid #000;
    padding: 26px 18px 24px;
    transition: background .15s, transform .15s;
  }
  a.paket:hover {
    background: #f2f2f2;
    transform: translateY(-3px);
  }
  a.paket .kode {
    display: block;
    font-size: 2rem;
    font-weight: bold;
    letter-spacing: 2px;
  }
  a.paket .nama {
    display: block;
    font-size: .9rem;
    margin-top: 8px;
    font-style: italic;
  }
  a.paket .ket {
    display: block;
    font-size: .78rem;
    color: #666;
    margin-top: 12px;
    font-family: Arial, Helvetica, sans-serif;
  }
  footer {
    margin-top: 34px;
    font-size: .8rem;
    color: #777;
    border-top: 1px solid #ccc;
    padding-top: 12px;
  }
  @media (max-width: 560px) {
    body { padding: 12px; }
    .card { padding: 30px 20px 34px; box-shadow: 0 2px 10px rgba(0,0,0,.22); }
    h1 { font-size: 1.3rem; }
    .pilihan { gap: 14px; }
    a.paket { flex: 1 1 100%; max-width: 100%; padding: 20px 16px; }
    a.paket .kode { font-size: 1.6rem; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Pilih Paket Soal</h1>
    <p class="sub">Evaluasi &mdash; Tes Potensi Skolastik</p>
    <hr class="rule">

    <div class="pilihan">
      <a class="paket" href="pu.html">
        <span class="kode">PU</span>
        <span class="nama">Penalaran Umum</span>
        <span class="ket">Pola barisan, interpretasi data, analitik kuantitatif, penarikan kesimpulan.</span>
      </a>
      <a class="paket" href="pk.html">
        <span class="kode">PK</span>
        <span class="nama">Penalaran Kuantitatif</span>
        <span class="ket">Sistem persamaan, matriks, pertidaksamaan, dan soal HOTS.</span>
      </a>
    </div>

    <footer>
      Kerjakan dengan caranya, jujur, dan tanpa bantuan AI.
    </footer>
  </div>
</body>
</html>
